<!DOCTYPE html>
<html lang="en-GB">
<head>
  <!--#block contact-meta-->
  <!--#include head.html-->
  <!--#data-->
</head>
<body data-page="contact">
  <a class="skip-link" href="#main">Skip to content</a>
  <!--#include header.html-->

  <main id="main">
    <section class="page-hero">
      <div class="container">
        <!--#block contact-hero-->
      </div>
    </section>

    <section class="section" style="padding-top:1rem">
      <div class="container">
        <div class="contact-grid">
          <div>
            <div class="contact-cards">
              <!--#block contact-cards-->
            </div>
            <!--#block contact-opening-->
          </div>

          <div>
            <form id="contactForm" class="event-side__card" style="padding:2rem" novalidate>
              <!--#block contact-form-head-->
              <div class="field">
                <label for="cfName">Your name *</label>
                <input id="cfName" name="name" type="text" required autocomplete="name">
              </div>
              <div class="field">
                <label for="cfEmail">Email *</label>
                <input id="cfEmail" name="email" type="email" required autocomplete="email">
              </div>
              <div class="field">
                <label for="cfPhone">Telephone / mobile</label>
                <input id="cfPhone" name="phone" type="tel" autocomplete="tel">
              </div>
              <div class="field">
                <label for="cfMsg">Message *</label>
                <textarea id="cfMsg" name="message" required placeholder="Tell us a little about what you need…"></textarea>
              </div>
              <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
              <button class="btn btn--orange btn--lg" type="submit">Send message</button>
              <div id="contactStatus" class="form-status" role="status"></div>
            </form>
          </div>
        </div>

        <!--#block contact-map-->
      </div>
    </section>
  </main>

  <!--#include footer.html-->
</body>
</html>
